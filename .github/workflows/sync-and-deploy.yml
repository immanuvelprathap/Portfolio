name: Sync content and deploy

on:
  push:
    branches: ['main']
  schedule:
    # Weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'sync-and-deploy'
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync external content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: immanuvelprathap
          GITHUB_EXCLUDE: immanuvelprathap,Portfolio
          ORCID_ID: ${{ secrets.ORCID_ID }}
          ORCID_AUTHOR_NAME: ${{ secrets.ORCID_AUTHOR_NAME || 'Immanuvel Prathap Sagayaraju' }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USERNAME: pahtarp_levunammi
        run: npm run sync

      - name: Commit synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/auto/
          if git diff --staged --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore: auto-sync content [skip ci]"
            git push
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy to immanuvelprathap.in
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PUSH_TOKEN_IMMANUVELPRATHAP }}
        run: |
          npx gh-pages -d dist \
            -r https://x-access-token:${{ secrets.GITHUB_PUSH_TOKEN_IMMANUVELPRATHAP }}@github.com/immanuvelprathap/immanuvelprathap.git \
            -b gh-pages \
            -u "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
